<article class="chapter-document">
  <header class="cp-heading">
    <p class="cp-status cp-status--upcoming">Upcoming Chapter</p>
    <h1 data-chapter="name">{{CHAPTER_NAME}}</h1>
    <p class="cp-location" data-chapter="location">{{LOCATION}}</p>
  </header>
  <section class="cp-introduction" aria-label="Chapter introduction">
    <div class="cp-message"><h2>About the chapter</h2><p data-chapter="message">{{MESSAGE}}</p></div>
  </section>
  <section class="cp-lead" aria-labelledby="cp-lead-heading">
    <h2 id="cp-lead-heading">Chapter Lead</h2>
    <div class="cp-person"><div class="cp-monogram" data-chapter="initials" aria-hidden="true">{{INITIALS}}</div><div><h3 data-chapter="lead">{{LEAD_NAME}}</h3><p class="cp-bio" data-chapter="bio">{{BIO}}</p><p class="cp-projects" data-chapter="projects">{{PROJECTS}}</p></div></div>
  </section>
</article>
