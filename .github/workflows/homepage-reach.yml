name: Refresh homepage chapter reach

on:
  push:
    branches: [main]
    paths:
      - 'chapter-content/manifest.json'
      - 'chapter-content/chapters/*.json'
      - 'index.html'
      - '.github/scripts/update-homepage-reach.mjs'
      - '.github/workflows/homepage-reach.yml'
  workflow_dispatch:

concurrency:
  group: homepage-reach
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    if: github.repository == 'zackaryxu/timeback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - name: Update the homepage from the published roster
        id: refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            node .github/scripts/update-homepage-reach.mjs
            if git diff --quiet -- index.html; then
              exit 0
            fi
            git add -- index.html
            git commit -m "Refresh homepage chapter reach"
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Request a Pages build for the updated homepage
        if: steps.refresh.outputs.committed == 'true' || github.event_name == 'workflow_dispatch' || github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
